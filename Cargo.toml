[workspace]
members = [
  "crates/aep-agent",
  "crates/aep-axum",
  "crates/aep-core",
  "crates/aep-platform",
  "crates/aep-service",
  "crates/aep-tower",
  "conformance",
  "examples",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nas Kavian <nas@inflowpay.ai>"]
license = "MIT"
repository = "https://github.com/aep-foundation/aep-rust"
homepage = "https://www.aep.foundation/"
keywords = ["agent", "aep", "authentication", "enrollment", "protocol"]
categories = ["api-bindings", "authentication", "web-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aep-agent = { version = "0.1.0", path = "crates/aep-agent" }
aep-axum = { version = "0.1.0", path = "crates/aep-axum" }
aep-core = { version = "0.1.0", path = "crates/aep-core" }
aep-platform = { version = "0.1.0", path = "crates/aep-platform" }
aep-service = { version = "0.1.0", path = "crates/aep-service" }
aep-tower = { version = "0.1.0", path = "crates/aep-tower" }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "pem", "std", "zeroize"] }
futures = "0.3.34"
futures-timer = "3.0.4"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
jwt-compact = { version = "0.8.0", default-features = false, features = ["ed25519-dalek", "p256", "std"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
percent-encoding = "2.3.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
