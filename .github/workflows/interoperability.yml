name: Node.js interoperability

on:
  pull_request:
    paths:
      - ".github/workflows/interoperability.yml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/**"
      - "examples/**"
      - "scripts/run-node-interoperability.sh"
      - "scripts/verify-node-interoperability.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aep-rust

      - uses: actions/checkout@v7
        with:
          repository: aep-foundation/aep-node
          path: aep-node

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - name: Install Node.js dependencies
        working-directory: aep-node
        run: pnpm install --frozen-lockfile

      - name: Run bidirectional interoperability
        working-directory: aep-rust
        run: make interoperability
        env:
          AEP_INTEROP_OUTPUT_DIR: .interop/reports
          AEP_NODE_DIR: ../aep-node
          RUSTUP_TOOLCHAIN: 1.88.0

      - name: Upload interoperability report
        uses: actions/upload-artifact@v7
        with:
          name: aep-rust-node-interoperability
          path: aep-rust/.interop/reports/aep-rust-node-interoperability.json
          if-no-files-found: error
          retention-days: 7
