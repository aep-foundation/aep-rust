name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Generate coverage report
        run: make coverage
        env:
          RUSTUP_TOOLCHAIN: 1.88.0

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: aep-rust-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.88.0"
          - stable
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
          fallback: none

      - name: Verify workspace
        run: make verify
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
